<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>車メモ</title>
<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --line:#d9d9d6; --text:#333; --sub:#888;
    --on:#4a4f55; --on-text:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Meiryo","メイリオ","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  .wrap{max-width:520px;margin:0 auto;padding:12px 16px 40px}
  nav{display:flex;gap:6px;margin-bottom:14px}
  nav button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);
    border-radius:8px;font:inherit;font-size:14px;color:var(--sub)}
  nav button.cur{color:var(--text);border-color:var(--on);font-weight:bold}
  button{font:inherit;color:inherit;cursor:pointer}
  .dateRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .dateRow button{border:1px solid var(--line);background:var(--card);border-radius:8px;
    width:44px;height:40px;font-size:18px}
  #dateText{font-size:20px;font-weight:bold}
  .todayRow{text-align:center;min-height:28px}
  #goToday{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:13px}
  .sub{color:var(--sub);font-size:13px;margin:6px 0 12px;line-height:1.6}

  /* 車ボタン */
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .car{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;text-align:left;min-height:78px}
  .car .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .car .badge{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line);
    border-radius:4px;text-align:center;font-size:12px;color:var(--text)}
  .car .plate{font-size:30px;font-weight:bold;letter-spacing:1px;margin-top:2px;white-space:nowrap;line-height:1.2}
  .car .plate.nameOnly{font-size:18px}
  .car.on{background:var(--on);border-color:var(--on);color:var(--on-text)}
  .car.on .top{color:#d6d8db}
  .car.on .badge{border-color:#8a8f95;color:var(--on-text)}

  .sumBox{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:15px;line-height:1.6}
  .wide{display:block;width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);
    background:var(--card);border-radius:10px;font-size:15px}
  .wide.done{color:var(--sub)}

  /* 一覧 */
  .month{font-size:13px;color:var(--sub);margin:16px 0 6px}
  .row{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:6px;font-size:15px;align-items:flex-start}
  .row .d{min-width:74px;font-weight:bold}
  .row .c{flex:1;line-height:1.6}
  .row .c small{color:var(--sub)}
  .empty{color:var(--sub);text-align:center;padding:30px 0}

  /* 設定 */
  .edit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .edit .line{display:flex;gap:6px;margin-bottom:6px}
  .edit label{font-size:11px;color:var(--sub);display:block;margin-bottom:2px}
  .edit input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px}
  .edit .f-no{width:64px;flex:none}
  .edit .f-name{flex:1}
  .edit .f-plate{flex:1}
  .edit .ops{display:flex;gap:6px;justify-content:flex-end}
  .edit .ops button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px}
  .edit .ops .del{color:#a33}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <button id="t-rec" class="cur">記録</button>
    <button id="t-list">一覧</button>
    <button id="t-set">車の設定</button>
  </nav>

  <!-- 記録 -->
  <section id="v-rec">
    <div class="dateRow">
      <button id="prev" aria-label="前の日">‹</button>
      <div id="dateText"></div>
      <button id="next" aria-label="次の日">›</button>
    </div>
    <div class="todayRow"><button id="goToday" hidden>今日にもどる</button></div>
    <div class="sub">駐車場にいない車をタップ（もう一度タップで取り消し）</div>
    <div id="grid"></div>
    <div class="sumBox" id="sumText"></div>
    <button class="wide" id="allHere">今日は全部いた</button>
  </section>

  <!-- 一覧 -->
  <section id="v-list" hidden>
    <div class="sub">いなかった車の一覧です（新しい日が上）</div>
    <div id="listBox"></div>
  </section>

  <!-- 設定 -->
  <section id="v-set" hidden>
    <div class="sub">ナンバーは「ひらがな＋数字」だけでOKです（例：と 3245）。<br>データはこのスマホの中だけに保存されます。</div>
    <div id="carEdit"></div>
    <button class="wide" id="addCar">＋ 車を追加</button>
  </section>
</div>

<script>
(function(){
  var KEY = "kuruma-memo-v1";
  var WEEK = ["日","月","火","水","木","金","土"];
  var defaults = {
    cars: [
      {id:"c1",no:"1",name:"ライズ",plate:""},
      {id:"c2",no:"2",name:"ハイゼット",plate:""},
      {id:"c3",no:"3",name:"プロボックス",plate:""},
      {id:"c4",no:"4",name:"クリッパー",plate:""},
      {id:"c5",no:"5",name:"ハイゼット",plate:""},
      {id:"c6",no:"6",name:"ユニック",plate:""},
      {id:"c7",no:"7",name:"トヨエース",plate:""},
      {id:"c8",no:"8",name:"スカイマスター",plate:""}
    ],
    records: {},   // "2026-10-09": ["c2","c3"]
    done: {}       // "2026-10-09": true（記録した日）
  };

  var data = load();
  var cur = todayKey();
  var $ = function(id){ return document.getElementById(id); };

  function load(){
    try{
      var s = localStorage.getItem(KEY);
      if(s){
        var d = JSON.parse(s);
        if(d && d.cars){
          d.records = d.records || {};
          d.done = d.done || {};
          d.cars.forEach(function(c){ if(c.plate == null) c.plate = ""; });
          return d;
        }
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(defaults));
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

  function keyOf(dt){
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  }
  function todayKey(){ return keyOf(new Date()); }
  function parse(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function label(k){ var d=parse(k); return (d.getMonth()+1)+"/"+d.getDate()+"（"+WEEK[d.getDay()]+"）"; }
  function shift(k,n){ var d=parse(k); d.setDate(d.getDate()+n); return keyOf(d); }
  function carIndex(id){ for(var i=0;i<data.cars.length;i++) if(data.cars[i].id===id) return i; return -1; }
  function carById(id){ var i=carIndex(id); return i<0 ? null : data.cars[i]; }
  function carHtml(id){
    var c = carById(id);
    if(!c) return "（削除した車）";
    return esc(c.no)+" "+esc(c.name)+(c.plate ? " <small>"+esc(c.plate)+"</small>" : "");
  }
  function sortIds(ids){
    return ids.slice().sort(function(a,b){
      var ia=carIndex(a), ib=carIndex(b);
      return (ia<0?999:ia)-(ib<0?999:ib);
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

  // ---- 記録 ----
  function renderRec(){
    $("dateText").textContent = label(cur);
    $("goToday").hidden = (cur===todayKey());
    var list = data.records[cur] || [];
    var g = $("grid"); g.innerHTML = "";
    data.cars.forEach(function(c){
      var b = document.createElement("button");
      b.className = "car" + (list.indexOf(c.id)>=0 ? " on" : "");
      if(c.plate){
        b.innerHTML = '<div class="top"><span class="badge">'+esc(c.no)+'</span>'+esc(c.name)+'</div>'+
                      '<div class="plate">'+esc(c.plate)+'</div>';
      }else{
        b.innerHTML = '<div class="top"><span class="badge">'+esc(c.no)+'</span></div>'+
                      '<div class="plate nameOnly">'+esc(c.name)+'</div>';
      }
      b.onclick = function(){ toggle(c.id); };
      g.appendChild(b);
    });
    var box = $("sumText");
    if(list.length){
      box.innerHTML = "いない車："+sortIds(list).map(carHtml).join("、");
    }else if(data.done[cur]){
      box.textContent = "全部いました";
    }else{
      box.textContent = "まだ記録していません";
    }
    var ah = $("allHere");
    ah.hidden = list.length > 0;
    ah.className = "wide" + (data.done[cur] && !list.length ? " done" : "");
    ah.textContent = (data.done[cur] && !list.length) ? "全部いた（取り消す）" : (cur===todayKey() ? "今日は全部いた" : "この日は全部いた");
  }
  function toggle(id){
    var list = data.records[cur] || [];
    var i = list.indexOf(id);
    if(i>=0) list.splice(i,1); else list.push(id);
    if(list.length){ data.records[cur] = list; data.done[cur] = true; }
    else { delete data.records[cur]; }
    save(); renderRec();
  }
  $("allHere").onclick = function(){
    if(data.done[cur]) delete data.done[cur]; else data.done[cur] = true;
    save(); renderRec();
  };
  $("prev").onclick = function(){ cur = shift(cur,-1); renderRec(); };
  $("next").onclick = function(){ cur = shift(cur,1); renderRec(); };
  $("goToday").onclick = function(){ cur = todayKey(); renderRec(); };

  // ---- 一覧 ----
  function renderList(){
    var keys = Object.keys(data.done).concat(Object.keys(data.records));
    keys = keys.filter(function(k,i){ return keys.indexOf(k)===i; }).sort().reverse();
    var box = $("listBox");
    if(!keys.length){ box.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
    var html = "", lastM = "";
    keys.forEach(function(k){
      var d = parse(k), m = d.getFullYear()+"年"+(d.getMonth()+1)+"月";
      if(m!==lastM){ html += '<div class="month">'+m+'</div>'; lastM = m; }
      var list = data.records[k] || [];
      html += '<div class="row"><div class="d">'+label(k)+'</div><div class="c">'+
        (list.length ? sortIds(list).map(carHtml).join("<br>") : '<small>全部いた</small>')+
        '</div></div>';
    });
    box.innerHTML = html;
  }

  // ---- 設定 ----
  function renderSet(){
    var box = $("carEdit"); box.innerHTML = "";
    data.cars.forEach(function(c, i){
      var el = document.createElement("div");
      el.className = "edit";
      el.innerHTML =
        '<div class="line">'+
          '<div class="f-no"><label>番号</label><input data-f="no" value="'+esc(c.no)+'"></div>'+
          '<div class="f-name"><label>呼び名</label><input data-f="name" value="'+esc(c.name)+'"></div>'+
        '</div>'+
        '<div class="line">'+
          '<div class="f-plate"><label>ナンバー</label><input data-f="plate" placeholder="例：と 3245" value="'+esc(c.plate||"")+'"></div>'+
        '</div>'+
        '<div class="ops">'+
          '<button data-op="up">↑</button><button data-op="down">↓</button>'+
          '<button data-op="del" class="del">削除</button>'+
        '</div>';
      el.querySelectorAll("input").forEach(function(inp){
        inp.oninput = function(){ c[inp.getAttribute("data-f")] = inp.value; save(); };
      });
      el.querySelector('[data-op="up"]').onclick = function(){
        if(i>0){ data.cars.splice(i-1,0,data.cars.splice(i,1)[0]); save(); renderSet(); }
      };
      el.querySelector('[data-op="down"]').onclick = function(){
        if(i<data.cars.length-1){ data.cars.splice(i+1,0,data.cars.splice(i,1)[0]); save(); renderSet(); }
      };
      el.querySelector('[data-op="del"]').onclick = function(){
        if(confirm((c.no||"")+" "+(c.name||"")+" を削除しますか？（記録は残ります）")){
          data.cars.splice(i,1); save(); renderSet();
        }
      };
      box.appendChild(el);
    });
  }
  $("addCar").onclick = function(){
    data.cars.push({id:"c"+Date.now(), no:String(data.cars.length+1), name:"", plate:""});
    save(); renderSet();
  };

  // ---- タブ ----
  var tabs = {rec:renderRec, list:renderList, set:renderSet};
  Object.keys(tabs).forEach(function(t){
    $("t-"+t).onclick = function(){
      Object.keys(tabs).forEach(function(u){
        $("v-"+u).hidden = (u!==t);
        $("t-"+u).className = (u===t ? "cur" : "");
      });
      if(t==="rec") cur = cur || todayKey();
      tabs[t]();
    };
  });

  renderRec();
})();
</script>
</body>
</html>
